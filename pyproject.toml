[project]
name = "crashtest"
version = "0.1.0"
description = "Cypress for AI agent security."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
crashtest = "crashtest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/crashtest/templates/scenarios.yml" = "crashtest/templates/scenarios.yml"
